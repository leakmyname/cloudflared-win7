name: Build Win7 32-bit (Fixed Version 2999.12.31)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go 1.21.13
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: false

      - name: Build cloudflared (fixed version 2999.12.31)
        run: bash build-win7.sh 2999.12.31

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-2999.12.31-win7-386
          path: cloudflared-2999.12.31-win7-386.exe
          if-no-files-found: error
