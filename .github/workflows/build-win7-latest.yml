name: Build Win7 32-bit (Latest Version)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go 1.21.13
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: false

      - name: Patch Go runtime for Win7
        run: bash patches/patch-go-runtime.sh "$(go env GOROOT)"

      - name: Clear Go cache
        run: go clean -cache

      - name: Build cloudflared (latest version)
        run: bash build-win7.sh
        env:
          GOROOT: ${{ env.GOROOT }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-latest-win7-386
          path: cloudflared-*-win7-386.exe
          if-no-files-found: error
